<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Tambah Perda | Satpol PP Gianyar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #0f172a;
      --secondary-color: #1e3c72;
      --accent-color: #f59e0b;
      --bg-color: #f8fafc;
    }
    body { background-color: var(--bg-color); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #1e293b; }
    
    .admin-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3c72 50%, #2563eb 100%);
      color: white;
      padding: 35px 20px;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 15px 30px -10px rgba(30, 64, 175, 0.25);
    }
    
    .form-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      margin-top: -30px;
      position: relative;
      z-index: 10;
      padding: 24px;
    }

    @media (min-width: 768px) {
      .form-card { padding: 40px; }
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .form-control, .form-select {
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.9rem;
      border: 1px solid #cbd5e1;
      background-color: #fcfdfe;
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      background-color: white;
    }

    .input-group-text {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 12px 0 0 12px;
      color: #64748b;
    }

    .btn-submit {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border: none;
      color: white;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(217, 119, 6, 0.45);
      color: white;
    }

    .btn-back {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 50px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-back:hover {
      background-color: #e2e8f0;
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="container-fluid p-0 pb-5">
    
    <div class="admin-header text-center text-md-start">
      <div class="container px-3">
        <div class="row align-items-center">
          <div class="col-md-8 mb-3 mb-md-0">
            <span class="badge bg-warning text-dark px-3 py-1 rounded-pill fw-bold mb-2 shadow-sm" style="font-size: 0.72rem; letter-spacing: 0.5px;">
              <i class="fa-solid fa-user-shield me-1"></i> PANEL ADMINISTRATOR
            </span>
            <h2 class="fw-bold mb-1 text-white fs-4 fs-md-3">Tambah Regulasi Perda Baru</h2>
            <p class="mb-0 text-white-50 small">Masukkan data peraturan daerah dengan lengkap untuk disinkronkan ke dashboard</p>
          </div>
          <div class="col-md-4 text-md-end">
            <a href="<?= getScriptUrl() ?>" class="btn btn-sm btn-light rounded-pill px-4 py-2 fw-bold text-dark shadow-sm" target="_top">
              <i class="fa-solid fa-arrow-left me-1"></i> Lihat Dashboard
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="container px-3">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="form-card">
            
            <form id="perdaForm" onsubmit="handleFormSubmit(event)">
              <div class="row g-3">
                
                <!-- Nomor & Tahun -->
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-hashtag text-primary me-1"></i> Nomor Perda</label>
                  <input type="text" class="form-control shadow-none" id="nomor" required placeholder="Contoh: 4 atau 12/Perbup">
                </div>
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-calendar-days text-primary me-1"></i> Tahun</label>
                  <input type="number" class="form-control shadow-none" id="tahun" required placeholder="Contoh: 2026">
                </div>

                <!-- Kategori & Nama Perda -->
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-filter text-primary me-1"></i> Kategori Perda</label>
                  <select class="form-select shadow-none" id="jenis" required>
                    <option value="">Pilih Kategori Perda...</option>
                    <option value="Ketertiban Umum dan Ketenteraman Masyarakat">Ketertiban Umum dan Ketenteraman Masyarakat</option>
                    <option value="Pedagang Kaki Lima (PKL) dan Fasilitas Umum">Pedagang Kaki Lima (PKL) dan Fasilitas Umum</option>
                    <option value="Bangunan dan Perizinan">Bangunan dan Perizinan</option>
                    <option value="Kebersihan dan Ketertiban">Kebersihan dan Ketertiban</option>
                    <option value="Usaha dan Kegiatan Masyarakat">Usaha dan Kegiatan Masyarakat</option>
                    <option value="Gelandangan, Pengemis, dan Gangguan Sosial">Gelandangan, Pengemis, dan Gangguan Sosial</option>
                    <option value="Peraturan Bupati (Perbup) / Kepala Daerah">Peraturan Bupati (Perbup) / Kepala Daerah</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label"><i class="fa-solid fa-book text-primary me-1"></i> Nama Perda</label>
                  <input type="text" class="form-control shadow-none" id="namaPerda" required placeholder="Contoh: Ketertiban Umum & Ketenteraman">
                </div>

                <!-- Tentang / Substansi -->
                <div class="col-12">
                  <label class="form-label"><i class="fa-solid fa-align-left text-primary me-1"></i> Objek / Substansi Perda (Tentang)</label>
                  <textarea class="form-control shadow-none" id="tentang" rows="4" required placeholder="Tuliskan ringkasan bab, pasal, atau substansi utama peraturan..."></textarea>
                </div>

                <!-- Sanksi / Tindakan -->
                <div class="col-12">
                  <label class="form-label"><i class="fa-solid fa-triangle-exclamation text-danger me-1"></i> Ketentuan Sanksi / Tindakan</label>
                  <textarea class="form-control shadow-none" id="sanksi" rows="3" placeholder="Tuliskan bentuk sanksi administratif, pidana, atau tindakan di lapangan..."></textarea>
                </div>

                <!-- Link Dokumen PDF -->
                <div class="col-12">
                  <label class="form-label"><i class="fa-solid fa-file-pdf text-danger me-1"></i> Link Dokumen PDF (Google Drive)</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-link"></i></span>
                    <input type="url" class="form-control shadow-none" id="link" required placeholder="https://drive.google.com/file/d/...">
                  </div>
                  <div class="form-text text-muted small mt-1"><i class="fa-solid fa-circle-info text-primary me-1"></i> Pastikan akses tautan Google Drive disetel ke <strong>"Siapa saja yang memiliki link"</strong>.</div>
                </div>

              </div>

              <!-- Action Buttons -->
              <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 pt-4 mt-4 border-top">
                <a href="<?= getScriptUrl() ?>" class="btn-back w-100 w-sm-auto text-center" target="_top">
                  <i class="fa-solid fa-arrow-left me-1"></i> Batal & Kembali
                </a>
                <button type="submit" class="btn-submit w-100 w-sm-auto text-center" id="submitBtn">
                  <i class="fa-solid fa-cloud-arrow-up me-1"></i> Simpan Data Perda
                </button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function handleFormSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Menyimpan ke Database...';

      const formData = {
        nomor: document.getElementById('nomor').value,
        tahun: document.getElementById('tahun').value,
        jenis: document.getElementById('jenis').value,
        namaPerda: document.getElementById('namaPerda').value,
        tentang: document.getElementById('tentang').value,
        sanksi: document.getElementById('sanksi').value,
        link: document.getElementById('link').value
      };

      google.script.run
        .withSuccessHandler(function(response) {
          const res = JSON.parse(response);
          if (res.status === 'success') {
            alert(res.message);
            document.getElementById('perdaForm').reset();
          } else {
            alert('Gagal menyimpan: ' + res.message);
          }
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-1"></i> Simpan Data Perda';
        })
        .withFailureHandler(function(error) {
          alert('Terjadi kesalahan sistem: ' + error.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-1"></i> Simpan Data Perda';
        })
        .addPerdaData(formData);
    }
  </script>
</body>
</html>
